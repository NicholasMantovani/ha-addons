name: Sync upstream releases

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      addon:
        description: "Add-on folder to check (empty = all add-ons with auto_update: true)"
        required: false
        default: ""
      dry_run:
        description: "Only report what would change, do not commit or release"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  plan:
    name: Select add-ons to check
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build matrix from .github/addons.yaml
        id: plan
        env:
          ONLY_ADDON: ${{ inputs.addon }}
        run: |
          set -euo pipefail
          all="$(yq -o=json -I=0 '[.addons | to_entries[] | {"addon": .key, "upstream_repo": .value.upstream_repo, "image": .value.image, "auto_update": (.value.auto_update != false)}]' .github/addons.yaml)"

          if [[ -n "${ONLY_ADDON}" ]]; then
            # Explicit manual request: run even if auto_update is false
            matrix="$(jq -c --arg a "${ONLY_ADDON}" '[.[] | select(.addon == $a)]' <<<"${all}")"
            [[ "${matrix}" != "[]" ]] || { echo "::error::Add-on '${ONLY_ADDON}' is not listed in .github/addons.yaml"; exit 1; }
          else
            matrix="$(jq -c '[.[] | select(.auto_update == true)]' <<<"${all}")"
          fi

          echo "Matrix: ${matrix}"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"

  sync:
    name: Sync ${{ matrix.addon }}
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # One at a time: every leg pushes to main
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      ADDON_DIR: ${{ matrix.addon }}
      UPSTREAM_REPO: ${{ matrix.upstream_repo }}
      UPSTREAM_IMAGE: ${{ matrix.image }}
      DRY_RUN: ${{ inputs.dry_run || false }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Compare upstream release with add-on version
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          release="$(gh api "repos/${UPSTREAM_REPO}/releases/latest")"
          tag="$(jq -r '.tag_name' <<<"${release}")"
          url="$(jq -r '.html_url' <<<"${release}")"
          published="$(jq -r '.published_at' <<<"${release}" | cut -dT -f1)"

          # Home Assistant expects a plain version: strip a leading v / V.
          version="${tag#[vV]}"
          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Upstream tag '${tag}' is not a semver-like version"
            exit 1
          fi

          current="$(yq -r '.version' "${ADDON_DIR}/config.yaml")"
          echo "Add-on            : ${ADDON_DIR}"
          echo "Current version   : ${current}"
          echo "Latest upstream   : ${tag} (${version}), published ${published}"

          # Compare upstream versions only: ignore the 4th "add-on revision"
          # number used for add-on-only fixes (e.g. 4.0.8.1 -> 4.0.8)
          current_base="$(cut -d. -f1-3 <<<"${current%%[-+]*}")"
          update=false
          if [[ "${version}" == "${current_base}" ]]; then
            echo "Already up to date."
          elif [[ "$(printf '%s\n%s\n' "${current_base}" "${version}" | sort -V | tail -n1)" != "${version}" ]]; then
            echo "::warning::Upstream ${version} is older than ${current}; not downgrading."
          else
            update=true
          fi

          {
            echo "update=${update}"
            echo "tag=${tag}"
            echo "version=${version}"
            echo "url=${url}"
            echo "published=${published}"
          } >> "${GITHUB_OUTPUT}"

      # GitHub releases are sometimes published before the Docker image is
      # pushed: only bump once the tag exists for every architecture we build.
      - name: Verify the Docker image is published
        id: image
        if: steps.check.outputs.update == 'true'
        env:
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          set -euo pipefail
          ready=true
          if ! manifest="$(docker manifest inspect "${UPSTREAM_IMAGE}:${TAG}" 2>/dev/null)"; then
            echo "::notice::Image ${UPSTREAM_IMAGE}:${TAG} is not published yet; retrying on the next run."
            ready=false
          else
            archs="$(jq -r '.manifests[]?.platform.architecture' <<<"${manifest}" | sort -u)"
            for ha_arch in $(yq -r '.arch[]' "${ADDON_DIR}/config.yaml"); do
              case "${ha_arch}" in
                aarch64) docker_arch=arm64 ;;
                amd64) docker_arch=amd64 ;;
                armv7) docker_arch=arm ;;
                *) docker_arch="${ha_arch}" ;;
              esac
              if ! grep -qx "${docker_arch}" <<<"${archs}"; then
                echo "::notice::Image ${UPSTREAM_IMAGE}:${TAG} has no ${docker_arch} variant yet; retrying on the next run."
                ready=false
              fi
            done
          fi
          echo "ready=${ready}" >> "${GITHUB_OUTPUT}"

      - name: Update add-on files
        if: steps.check.outputs.update == 'true' && steps.image.outputs.ready == 'true'
        env:
          TAG: ${{ steps.check.outputs.tag }}
          VERSION: ${{ steps.check.outputs.version }}
          URL: ${{ steps.check.outputs.url }}
          PUBLISHED: ${{ steps.check.outputs.published }}
        run: |
          set -euo pipefail

          # config.yaml: add-on version
          sed -i -E "s|^version:.*$|version: \"${VERSION}\"|" "${ADDON_DIR}/config.yaml"

          # build.yaml + Dockerfile: base image tag (dots escaped for the regex)
          image_re="$(printf '%s' "${UPSTREAM_IMAGE}" | sed 's/[.]/\\./g')"
          sed -i -E "s|(${image_re}):[^\"[:space:]]+|\1:${TAG}|g" \
            "${ADDON_DIR}/build.yaml" "${ADDON_DIR}/Dockerfile"

          # CHANGELOG.md: new entry right below the marker
          ENTRY="$(printf '## %s\n\n- Bump %s to [%s](%s) (upstream release of %s).\n  See the upstream release notes for details.' \
            "${VERSION}" "${UPSTREAM_REPO#*/}" "${TAG}" "${URL}" "${PUBLISHED}")" \
          awk '!done && /^<!-- next-entry -->/ { print; print ""; print ENVIRON["ENTRY"]; done = 1; next } { print }' \
            "${ADDON_DIR}/CHANGELOG.md" > "${RUNNER_TEMP}/CHANGELOG.md"
          mv "${RUNNER_TEMP}/CHANGELOG.md" "${ADDON_DIR}/CHANGELOG.md"

          git --no-pager diff

      - name: Commit and push to main
        if: steps.check.outputs.update == 'true' && steps.image.outputs.ready == 'true' && env.DRY_RUN != 'true'
        env:
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${ADDON_DIR}"
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "${ADDON_DIR}: bump to upstream ${TAG}"
          # A previous matrix leg may have pushed already
          git pull --rebase origin main
          git push origin HEAD:main

  # Pushes made with GITHUB_TOKEN do not trigger release.yml's `push` event,
  # so releases are published explicitly here. release.yml is idempotent:
  # it only creates releases that do not exist yet.
  release:
    name: Publish GitHub releases
    needs: sync
    if: ${{ !cancelled() && !inputs.dry_run }}
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
