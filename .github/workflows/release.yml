name: Release

# For every add-on folder, publishes a GitHub release tagged
# "<addon>-v<version>" for the version found in its config.yaml, using the
# matching CHANGELOG.md section as release notes.
# Idempotent: releases that already exist are skipped. Runs on every push to
# main, on demand, and is called by sync-upstream.yml after automatic bumps
# (pushes made with GITHUB_TOKEN do not trigger `push` workflows).

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  release:
    name: Publish missing add-on releases
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Create releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target="$(git rev-parse HEAD)"

          for config in */config.yaml; do
            addon="$(dirname "${config}")"
            name="$(yq -r '.name' "${config}")"
            version="$(yq -r '.version' "${config}")"
            tag="${addon}-v${version}"

            if gh release view "${tag}" >/dev/null 2>&1; then
              echo "✓ ${tag} already released"
              continue
            fi

            notes="${RUNNER_TEMP}/${addon}-notes.md"
            # Lines between "## <version>" and the next "## " heading
            awk -v ver="${version}" '
              /^## / { if (found) exit; if ($2 == ver) { found = 1; next } }
              found
            ' "${addon}/CHANGELOG.md" 2>/dev/null | sed -e '/./,$!d' > "${notes}" || true

            if [[ ! -s "${notes}" ]]; then
              echo "${name} add-on ${version}." > "${notes}"
            fi

          cat >> "${notes}" <<EOF

          ---

          **Install / update:** add \`https://github.com/${GITHUB_REPOSITORY}\` to the
          Home Assistant add-on store, or update **${name}** from
          *Settings → Add-ons* if it is already installed.
          EOF

            echo "→ Creating ${tag}"
            cat "${notes}"
            gh release create "${tag}" \
              --title "${name} ${version}" \
              --notes-file "${notes}" \
              --target "${target}"
          done
