# Front proxy for the Shelfmark add-on, started by ha-run.sh.
# Shelfmark itself listens on 127.0.0.1:8085 at the root (no URL_BASE).
worker_processes 1;
pid /run/nginx-ha-shelfmark.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    access_log off;
    server_tokens off;
    absolute_redirect off;
    client_max_body_size 0;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }
    # Keep what a proxy in front (Home Assistant Ingress, a reverse proxy,
    # Tailscale Serve) sends, fall back to this request
    map $http_x_forwarded_host $fwd_host {
        ''      $http_host;
        default $http_x_forwarded_host;
    }
    map $http_x_forwarded_proto $fwd_proto {
        ''      $scheme;
        default $http_x_forwarded_proto;
    }
    map $http_x_forwarded_for $fwd_for {
        ''      $remote_addr;
        default $http_x_forwarded_for;
    }
    # /api/hassio_ingress/<token>, as sent by Home Assistant Ingress
    map $http_x_ingress_path $ingress_path {
        default                 '';
        '~^/[A-Za-z0-9_/-]+$'   $http_x_ingress_path;
    }

    # Direct access (LAN, reverse proxy, Tailscale Serve): plain Shelfmark
    server {
        listen 8084 default_server;

        location / {
            proxy_pass http://127.0.0.1:8085;
            include /etc/nginx/ha-proxy-params.conf;
            proxy_redirect off;
        }
    }

    # Home Assistant Ingress: only the Ingress gateway may connect.
    # Ingress strips its path before forwarding, while the browser still has
    # it, so put it back where the browser needs it: the <base> tag (the
    # frontend takes its router, API and socket.io paths from it), redirects
    # and the session cookie path.
    server {
        listen 8099 default_server;
        allow 172.30.32.2;
        deny all;

        location / {
            proxy_pass http://127.0.0.1:8085;
            include /etc/nginx/ha-proxy-params.conf;
            # sub_filter cannot rewrite a compressed response
            proxy_set_header Accept-Encoding "";
            sub_filter '<base href="/"' '<base href="$ingress_path/"';
            sub_filter_once on;
            proxy_redirect / $ingress_path/;
            proxy_cookie_path / $ingress_path/;
        }
    }
}
