# ==============================================================================
# Home Assistant Ingress proxy for Calibre-Web Automated
#
# Home Assistant serves the add-on under /api/hassio_ingress/<token>/ and
# strips that prefix before forwarding the request here. Calibre-Web supports
# running under a sub-path through the X-Script-Name header (cps/reverseproxy.py),
# so the prefix sent by Home Assistant in X-Ingress-Path is passed on as
# X-Script-Name and every generated link includes it.
#
# Direct access on port 8083 (LAN, OPDS, Kobo Sync) does not go through here.
# ==============================================================================
worker_processes 1;
pid /run/nginx-ha-ingress.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    access_log off;
    server_tokens off;

    # Book uploads can be large
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8099 default_server;

        # Only the Home Assistant Ingress gateway may connect
        allow 172.30.32.2;
        deny all;

        location / {
            proxy_pass http://127.0.0.1:8083;
            proxy_http_version 1.1;
            proxy_redirect off;

            proxy_set_header Host $http_host;
            proxy_set_header X-Script-Name $http_x_ingress_path;
            proxy_set_header X-Scheme $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
